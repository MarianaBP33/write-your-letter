<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>For You ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fbe9e7;
    --bg2: #f6d5d9;
    --paper: #fffaf5;
    --ink: #4a2c2a;
    --accent: #c2185b;
    --soft: #b07a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--ink);
    background: radial-gradient(circle at 30% 20%, var(--bg1), var(--bg2));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    overflow-x: hidden;
  }

  /* floating hearts */
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .hearts span {
    position: absolute;
    bottom: -40px;
    color: var(--accent);
    opacity: 0;
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .35; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  /* envelope intro */
  .intro {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.25rem;
    background: radial-gradient(circle at 30% 20%, var(--bg1), var(--bg2));
    transition: opacity .8s ease, visibility .8s ease;
  }
  .intro.ready { cursor: pointer; }
  .intro.hidden { opacity: 0; visibility: hidden; }
  .envelope {
    width: 200px; height: 130px;
    background: #f8c8d0;
    position: relative;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(150, 60, 80, .25);
  }
  .intro.ready .envelope { animation: bob 2.4s ease-in-out infinite; }
  .envelope::before {
    content: "";
    position: absolute; top: 0; left: 0;
    border-left: 100px solid transparent;
    border-right: 100px solid transparent;
    border-top: 75px solid #f3a9b7;
    border-radius: 6px 6px 0 0;
  }
  .seal {
    position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent);
    color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .tap { font-style: italic; font-size: 1.2rem; color: var(--soft); letter-spacing: .03em; min-height: 1.5em; }

  /* letter */
  .letter {
    position: relative; z-index: 1;
    width: 100%; max-width: 620px;
    background: var(--paper);
    padding: 3rem 2.25rem 3.5rem;
    border-radius: 4px;
    box-shadow: 0 20px 50px rgba(120, 50, 60, .18);
    opacity: 0; transform: translateY(30px);
    transition: opacity 1.2s ease .3s, transform 1.2s ease .3s;
  }
  .letter.show { opacity: 1; transform: none; }
  .letter::before {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(194, 24, 91, .15);
    pointer-events: none;
  }
  .greeting {
    font-family: "Great Vibes", cursive;
    font-size: 2.6rem;
    color: var(--accent);
    margin-bottom: 1.5rem;
    font-weight: 400;
  }
  .body p {
    font-size: 1.25rem;
    line-height: 1.75;
    margin-bottom: 1.1rem;
  }
  /* blank lined space, shown while the letter has no paragraphs */
  .placeholder {
    min-height: 260px;
    background: repeating-linear-gradient(transparent, transparent 34px, rgba(176,122,122,.25) 35px);
  }
  .signoff {
    margin-top: 2rem; text-align: right;
    font-style: italic; font-size: 1.25rem;
  }
  .signoff .name {
    display: block;
    font-family: "Great Vibes", cursive;
    font-style: normal;
    font-size: 2.2rem;
    color: var(--accent);
    margin-top: .25rem;
  }
  .heart-end { text-align: center; margin-top: 2rem; color: var(--accent); font-size: 1.4rem; }

  @media (max-width: 480px) {
    .letter { padding: 2.25rem 1.5rem 2.75rem; }
    .greeting { font-size: 2.2rem; }
    .body p { font-size: 1.15rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hearts { display: none; }
    .intro.ready .envelope { animation: none; }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="intro" id="intro">
  <div class="envelope"><div class="seal">♥</div></div>
  <p class="tap" id="tap"></p>
</div>

<main class="letter" id="letter" hidden>
  <h1 class="greeting" id="greeting"></h1>
  <div class="body" id="body"></div>
  <p class="signoff">
    <span id="signoff"></span>
    <span class="name" id="name"></span>
  </p>
  <div class="heart-end">♡</div>
</main>

<script>
  // By default the letter text lives in letter.js.
  // Optional secret key: move it to letters/<key>.js and open the site with ?k=<key>.
  // If there's no letter to load, the envelope stays sealed.
  const $ = (id) => document.getElementById(id);
  const intro = $('intro'), letter = $('letter'), tap = $('tap');

  function sealed() {
    tap.textContent = 'this letter is sealed';
  }

  function render(L) {
    $('greeting').textContent = L.greeting || '';
    $('signoff').textContent = L.signoff || '';
    $('name').textContent = L.name || '';
    const body = $('body');
    const paras = (L.paragraphs || []).filter(Boolean);
    if (paras.length === 0) {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      body.appendChild(ph);
    } else {
      for (const text of paras) {
        const p = document.createElement('p');
        p.textContent = text;
        body.appendChild(p);
      }
    }
    letter.hidden = false;
    tap.textContent = 'tap to open';
    intro.classList.add('ready');
    intro.addEventListener('click', () => {
      intro.classList.add('hidden');
      letter.classList.add('show');
    }, { once: true });
  }

  const key = new URLSearchParams(location.search).get('k');
  let src = null;
  if (key === null) src = 'letter.js';
  else if (/^[A-Za-z0-9_-]{1,64}$/.test(key)) src = 'letters/' + key + '.js';

  if (!src) {
    sealed();
  } else {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => (window.LETTER ? render(window.LETTER) : sealed());
    s.onerror = sealed;
    document.head.appendChild(s);
  }

  const hearts = $('hearts');
  for (let i = 0; i < 18; i++) {
    const h = document.createElement('span');
    h.textContent = '♥';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (10 + Math.random() * 18) + 'px';
    h.style.animationDuration = (8 + Math.random() * 10) + 's';
    h.style.animationDelay = (Math.random() * 12) + 's';
    hearts.appendChild(h);
  }
</script>
</body>
</html>
